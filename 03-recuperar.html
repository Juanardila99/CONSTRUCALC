<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña - Constructor Calc</title>
    <meta name="author" content="Nicolas Molina Joven, Juan David Figueroa Ardila">
  <link rel="stylesheet" href="stylerecuperar.css">
</head>
<body>

  <main class="contenedor">
    <div class="caja-superior">CC</div>
    <div class="tarjeta">
      <h1>Olvidé mi contraseña</h1>
      <p style="text-align: center; margin-bottom: 50px ;">Ingresa tu usuario vinculado con tu cuenta.</p>
      </p>

      <form>
        <div class="campo">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" name="usuario" placeholder="Usuario">
        </div>

        <div class="campo">
          <label for="contrasena">Nueva contraseña</label>
          <input type="password" id="contrasena" name="contrasena" placeholder="Escribe tu contraseña">
        </div>

        <div class="campo">
          <label for="nueva_contrasena">Repita contraseña</label>
          <input type="password" id="nueva_contrasena" name="nueva_contrasena" placeholder="Escribe tu nueva contraseña">
        </div>

        <a href="01-login.html" class="boton">Restablecer</a>
      </form>

      <a href="01-login.html" class="volver">&larr; Volver al inicio de sesión</a>
    </div>
  </main>

</body>
</html>
