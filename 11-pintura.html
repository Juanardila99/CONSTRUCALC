<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calcular pintura - Constructor Calc</title>
    <meta name="author" content="Nicolas Molina Joven, Juan David Figueroa Ardila">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">

    
    <a href="04-menu.html" class="header-volver">
        <span class="flecha">←</span>
        <span>Menú</span>
        <span class="separador">/</span>
        <span class="pagina-actual">Calcular Pintura</span>
    </a>

    
    <div class="header-logo">
        CC
    </div>

</header>

  <main class="contenedor">
    <div class="tarjeta">
      <h1>Calcular pintura</h1>

      <form>
        <div class="campo">
          <label for="superficie">Superficie del muro (m&sup2;)</label>
          <input type="number" id="superficie" name="superficie" step="0.01" placeholder="Ej: 12">
        </div>

        <button type="button" class="boton">Calcular</button>
      </form>

      <div class="resultado">
        <h2>Resultado (ejemplo)</h2>
        <ul>
          <li>Pintura necesaria: 2 litros</li>
        </ul>
      
  </main>

</body>
</html>
