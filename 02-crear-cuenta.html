<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta - Constructor Calc</title>
    <meta name="author" content="Nicolas Molina Joven, Juan David Figueroa Ardila">
  <link rel="stylesheet" href="stylecrear.css">
</head>
<body>


  <main class="contenedor">
    <div class="caja-superior">CC</div>
    <div class="tarjeta">
      <h1>CREAR CUENTA</h1>
      <p style="text-align:center ; margin-bottom: 50px;">Regístrate para empezar a calcular</p>

      <form>
        <div class="campo">
          <label for="usuario">Nombre de Usuario</label>
          <input type="text" id="usuario" name="usuario" placeholder="Usuario o correo">
        </div>

        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" placeholder="Crea una contraseña">
        </div>

        <div class="campo">
          <label for="confirmar">Confirmar contraseña</label>
          <input type="password" id="confirmar" name="confirmar" placeholder="Repite la contraseña">
        </div>

        <a href="01-login.html" class="boton">Registrarse</a>
      </form>

      <div class="enlaces-secundarios">
        <p><a href="01-login.html">Ya tengo cuenta</a></p>
      </div>
    </div>
  </main>

</body>
</html>
